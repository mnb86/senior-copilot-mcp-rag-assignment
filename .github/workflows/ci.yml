name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: .:apps/backend:apps/alarm-api-simulator:mcp-servers/alarm-management

jobs:
  python:
    name: Python - lint, types, tests, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Format check
        run: ruff format --check .
      - name: Lint (incl. security rules)
        run: ruff check .
      - name: Static analysis
        run: mypy apps/backend/copilot apps/alarm-api-simulator/alarm_simulator mcp-servers/alarm-management/alarm_mcp connectors rag
      - name: Unit + RAG tests
        run: pytest tests/unit rag/tests --cov --cov-report=
      - name: MCP server / client + orchestration integration tests
        run: pytest tests/integration --cov --cov-append --cov-report=
      - name: End-to-end (backend -> MCP -> Alarm API + RAG)
        run: pytest tests/e2e --cov --cov-append --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: RAG ingestion (index build)
        run: python -m rag.ingestion --docs rag/documents --index .rag_index --force
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  contract:
    name: Postman contract (newman) against the simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt && npm install -g newman
      - name: Start simulator
        run: |
          ALARM_API_TOKEN=demo-token python -m alarm_simulator &
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 1; done
      - name: Run collections
        run: |
          for c in postman/Alarm-API-Simulator.postman_collection.json \
                   postman/chaining/Alarm-API-Chaining.postman_collection.json \
                   postman/scenarios/Alarm-API-Scenarios.postman_collection.json; do
            newman run "$c" --env-var baseUrl=http://localhost:8000 --env-var auth_token=demo-token --bail
          done

  frontend:
    name: Frontend - typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - name: npm audit (high)
        working-directory: apps/frontend
        run: npm install --package-lock-only && npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build images + compose smoke test
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: |
          docker compose up --build -d
          for i in $(seq 1 90); do curl -fs http://localhost:3000/api/health && break; sleep 3; done
      - name: Smoke test (acceptance scenario through the GUI proxy)
        run: |
          curl -fs http://localhost:3000/api/health
          curl -fs http://localhost:3000/api/tools | python3 -c "import sys,json; assert len(json.load(sys.stdin)['tools'])==13"
          curl -fs -X POST http://localhost:3000/api/chat -H 'content-type: application/json' \
            -d '{"message":"Investigate recurring high-severity alarms for Boiler Feed Pump 101 over the last 90 days"}' \
            | python3 -c "import sys,json; b=json.load(sys.stdin); assert b['citations'] and b['answer']['confidence']!='low', b['answer']"
      - if: always()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
