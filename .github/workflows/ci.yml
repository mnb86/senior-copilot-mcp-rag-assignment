name: CI

# Covers the assignment's CI checklist; each item is a named step:
# formatting, linting, static analysis, unit / MCP / RAG / integration (+ end-to-end) tests,
# build validation, and security / dependency checks.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: .:apps/backend:mcp-servers/alarm-management:mcp-servers/optional-secondary-server

jobs:
  python:
    name: Python - formatting, linting, static analysis, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r apps/backend/requirements-dev.txt
      - name: Formatting
        run: ruff format --check .
      - name: Linting (incl. flake8-bandit security rules)
        run: ruff check .
      - name: Static analysis (mypy)
        run: >-
          mypy apps/backend/copilot apps/backend/alarm_simulator mcp-servers/alarm-management/alarm_mcp
          mcp-servers/optional-secondary-server/document_mcp connectors rag
      - name: Unit tests
        run: pytest tests/unit --cov --cov-report=
      - name: MCP tests (server tools, client over streamable HTTP, secondary server)
        run: >-
          pytest tests/integration/test_mcp_server.py tests/integration/test_mcp_client.py
          tests/integration/test_document_mcp_server.py --cov --cov-append --cov-report=
      - name: RAG tests (ingestion + retrieval)
        run: pytest rag/tests --cov --cov-append --cov-report=
      - name: Integration tests (orchestration across MCP + RAG)
        run: pytest tests/integration/test_orchestration.py --cov --cov-append --cov-report=
      - name: End-to-end tests (backend -> MCP -> Alarm API + RAG)
        run: pytest tests/e2e --cov --cov-append --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Build validation (RAG index build)
        run: python -m rag.ingestion --docs rag/documents --index rag/retrieval/.index --force
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  contract:
    name: API contract - Postman collections (newman) against the simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r apps/backend/requirements.txt && npm install -g newman
      - name: Start simulator
        run: |
          ALARM_API_TOKEN=demo-token python -m alarm_simulator &
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 1; done
      - name: Run collections
        run: |
          for c in test-data/postman/Alarm-API-Simulator.postman_collection.json \
                   test-data/postman/chaining/Alarm-API-Chaining.postman_collection.json \
                   test-data/postman/scenarios/Alarm-API-Scenarios.postman_collection.json; do
            newman run "$c" --env-var baseUrl=http://localhost:8000 --env-var auth_token=demo-token --bail
          done

  frontend:
    name: Frontend - type check, tests, build validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Static analysis (TypeScript)
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Build validation (production build)
        run: npm run build

  security:
    name: Security and dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python dependency audit (pip-audit)
        run: pip install pip-audit && pip-audit -r apps/backend/requirements.txt
      - name: npm dependency audit (high and above)
        working-directory: apps/frontend
        run: npm audit --audit-level=high
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build validation - docker compose up --build + smoke test
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build and start the stack (health-gated)
        run: |
          docker compose up --build -d
          for i in $(seq 1 100); do curl -fs http://localhost:3000/api/health && break; sleep 3; done
      - name: Service health (every long-running service healthy, ingestion job exited 0)
        run: |
          docker compose ps -a
          for s in alarm-api alarm-mcp docs-mcp copilot-backend frontend; do
            test "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q $s)")" = healthy || { echo "$s not healthy"; exit 1; }
          done
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -a -q rag-ingest)")" = 0
      - name: Smoke test - every API endpoint, every MCP tool, copilot API
        env:
          ALARM_API_TOKEN: demo-token
          MCP_SERVER_TOKEN: change-me-mcp-token
          DOCS_MCP_SERVER_TOKEN: change-me-docs-mcp-token
        run: |
          pip install -r apps/backend/requirements.txt
          python scripts/smoke_test.py
      - name: Acceptance scenario through the GUI proxy (nginx -> backend)
        run: |
          curl -fs http://localhost:3000/ | grep -q '<div id="root">'
          curl -fs -X POST http://localhost:3000/api/chat -H 'content-type: application/json' \
            -d '{"message":"Investigate recurring high-severity alarms for Boiler Feed Pump 101 over the last 90 days"}' \
            | python3 -c "import sys,json; b=json.load(sys.stdin); assert b['citations'] and b['answer']['confidence']!='low', b['answer']"
      - if: always()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
