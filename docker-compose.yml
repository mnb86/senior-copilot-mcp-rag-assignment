# docker compose up --build   ->  GUI on http://localhost:3000
name: alarm-copilot

x-python: &python
  build:
    context: .
    dockerfile: Dockerfile
  image: alarm-copilot-python:latest
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

services:
  alarm-api:
    <<: *python
    command: ["python", "-m", "alarm_simulator"]
    environment:
      ALARM_API_TOKEN: ${ALARM_API_TOKEN:-demo-token}
      SIM_PORT: "8000"
      SIM_FAULTS: ${SIM_FAULTS:-POST /alarms/correlation=503x1}
      SIM_FAULT_CLIENTS: ${SIM_FAULT_CLIENTS:-alarm-mcp-server}
      SIM_ANCHOR_TIME: ${SIM_ANCHOR_TIME:-}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  alarm-mcp:
    <<: *python
    command: ["python", "-m", "alarm_mcp"]
    environment:
      ALARM_API_BASE_URL: http://alarm-api:8000
      ALARM_API_TOKEN: ${ALARM_API_TOKEN:-demo-token}
      ALARM_API_TIMEOUT_SECONDS: ${ALARM_API_TIMEOUT_SECONDS:-10}
      ALARM_API_MAX_RETRIES: ${ALARM_API_MAX_RETRIES:-2}
      MCP_PORT: "9000"
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-change-me-mcp-token}
      MCP_ENABLED_TOOLS: ${MCP_ENABLED_TOOLS:-}
    ports: ["9000:9000"]
    depends_on:
      alarm-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  rag-ingest:
    <<: *python
    restart: "no"
    command: ["python", "-m", "rag.ingestion", "--docs", "/app/rag/documents", "--index", "/data/rag_index"]
    environment:
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lsa}
    volumes:
      - rag-index:/data/rag_index

  copilot-backend:
    <<: *python
    command: ["python", "-m", "copilot"]
    environment:
      MCP_SERVER_URL: http://alarm-mcp:9000/mcp
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-change-me-mcp-token}
      DOCUMENT_PATH: /app/rag/documents
      RAG_INDEX_PATH: /data/rag_index
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lsa}
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      COPILOT_PORT: "8080"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      COPILOT_ADMIN_TOKEN: ${COPILOT_ADMIN_TOKEN:-}
    volumes:
      - rag-index:/data/rag_index
    ports: ["8080:8080"]
    depends_on:
      alarm-mcp: { condition: service_healthy }
      rag-ingest: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: apps/frontend
    ports: ["3000:80"]
    depends_on:
      copilot-backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  rag-index:
